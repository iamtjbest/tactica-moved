<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tactica has moved</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1317; --sur:#151E25; --bd:#1E2A33;
    --volt:#CCFF00; --cyan:#00E5FF; --mt:#8A9BA8; --white:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--white);
    font-family:'DM Sans',system-ui,-apple-system,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }
  .wrap{max-width:560px; width:100%}
  .tag{
    font-size:12px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
    color:var(--cyan); margin-bottom:20px;
  }
  h1{
    font-family:'Playfair Display',Georgia,serif; font-weight:800;
    font-size:clamp(32px,7vw,52px); line-height:1.1; margin-bottom:16px;
  }
  p{color:var(--mt); font-size:16px; line-height:1.6; margin-bottom:12px}
  .host{
    display:inline-block; background:var(--sur); border:1px solid var(--bd);
    border-radius:12px; padding:14px 18px; margin:20px 0 28px;
    font-size:15px; color:var(--mt); word-break:break-all;
  }
  .host b{color:var(--white); font-weight:700}
  .arrow{color:var(--volt); padding:0 8px; font-weight:700}
  a.cta{
    display:inline-block; background:var(--cyan); color:var(--bg);
    font-weight:700; font-size:16px; text-decoration:none;
    padding:16px 32px; border-radius:12px; transition:opacity .15s;
  }
  a.cta:hover{opacity:.85}
  .foot{
    margin-top:40px; font-size:12px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--mt);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tag">New address</div>
    <h1>Tactica has moved</h1>
    <p>We are now on a new domain. Update your bookmarks.</p>

    <div class="host">
      <span id="old">tactica.com.ng</span>
      <span class="arrow">&rarr;</span>
      <b id="new">tacticaengine.com</b>
    </div>

    <div><a class="cta" id="go" href="https://tacticaengine.com">Go to the new site</a></div>

    <div class="foot">Tactica / Cantera</div>
  </div>

<script>
  (function () {
    var h = (location.hostname || "").toLowerCase();
    var isApp = h.indexOf("app.") === 0;
    var oldHost = isApp ? "app.tactica.com.ng" : "tactica.com.ng";
    var newHost = isApp ? "app.tacticaengine.com" : "tacticaengine.com";

    document.getElementById("old").textContent = oldHost;
    document.getElementById("new").textContent = newHost;

    // carry the path across, so a deep link lands in the right place
    var dest = "https://" + newHost + (location.pathname || "") + (location.search || "");
    var a = document.getElementById("go");
    a.href = dest;
    a.textContent = isApp ? "Open the engine" : "Go to the new site";
  })();
</script>
</body>
</html>
